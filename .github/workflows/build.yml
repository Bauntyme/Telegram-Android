name: Build AeroGram Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-aerogram:
    name: Build AeroGram Release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Free Runner Disk Space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/system-images || true
          sudo find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 ! -name '27.2.12479018' -exec rm -rf {} + 2>/dev/null || true
          df -h

      - name: Checkout AeroGram
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Init Submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1 --jobs 4 || git submodule update --init --recursive --jobs 4
          df -h

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK, NDK 27.2 & CMake 3.22.1
        run: |
          ANDROID_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${ANDROID_SDK}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK}/ndk/27.2.12479018" >> "$GITHUB_ENV"
          SDKMGR="${ANDROID_SDK}/cmdline-tools/latest/bin/sdkmanager"
          yes | sudo "$SDKMGR" --licenses >/dev/null || true
          yes | sudo "$SDKMGR" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          df -h

      - name: Grant Gradle Wrapper Permissions
        run: chmod +x gradlew

      - name: Prepare Private AeroGram Signing Key
        env:
          AERO_KEYSTORE_B64: ${{ secrets.AERO_KEYSTORE_B64 }}
        run: |
          if [ -n "$AERO_KEYSTORE_B64" ]; then
            echo "$AERO_KEYSTORE_B64" | base64 -d > TMessagesProj/config/release.keystore
            echo "Applied private AeroGram signing keystore."
          fi

      - name: Compile AeroGram Release APK
        env:
          AERO_STORE_PASS: ${{ secrets.AERO_STORE_PASS }}
          AERO_KEY_ALIAS: ${{ secrets.AERO_KEY_ALIAS }}
          AERO_KEY_PASS: ${{ secrets.AERO_KEY_PASS }}
        run: |
          if [ -n "$AERO_STORE_PASS" ]; then
            ./gradlew :TMessagesProj_App:assembleAfatRelease \
              -PRELEASE_STORE_PASSWORD="$AERO_STORE_PASS" \
              -PRELEASE_KEY_ALIAS="$AERO_KEY_ALIAS" \
              -PRELEASE_KEY_PASSWORD="$AERO_KEY_PASS" \
              --no-daemon --max-workers=2 --stacktrace
          else
            ./gradlew :TMessagesProj_App:assembleAfatRelease --no-daemon --max-workers=2 --stacktrace
          fi

      - name: Upload AeroGram APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AeroGram-APK
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
